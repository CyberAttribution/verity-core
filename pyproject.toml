[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verity-core"
version = "0.5.0"
description = "Shared Core for Verity and PhishFinder: Gemini transport, technical intel, storage, scraping."
requires-python = ">=3.10"
dependencies = [
    "requests",
    "python-whois",
    "dnspython",
    "beautifulsoup4",
    "google-cloud-storage",
]

# nodriver is an OPTIONAL extra. scraping.py imports it lazily inside the
# advanced-scrape function, so merely importing verity_core never requires the
# heavy headless-browser dependency. Verity installs verity-core[scraping];
# PhishFinder installs plain verity-core and never pulls nodriver.
[project.optional-dependencies]
scraping = ["nodriver"]
# media: evidence extraction + (later stage) YouTube retrieval. System
# packages ffmpeg/ffprobe and exiftool are required at runtime and are
# installed by the consuming service's image (see backend Dockerfile);
# missing tools are reported honestly in the evidence package.
media = ["yt-dlp"]

[tool.setuptools.packages.find]
include = ["verity_core*"]

[tool.pytest.ini_options]
# The vendored dependency includes copies of Core tests; collect canonical
# Core tests and Node-specific tests once, avoiding duplicate module names.
testpaths = ["tests", "apps/node/swarmtracker_node_ui"]

python_files = ["test_*.py", "tests_*.py"]
